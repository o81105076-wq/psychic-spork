<style>
  :root {
    --bg-dark: #0a0809;
    --text-main: #f5ecee;
    --text-muted: rgba(245, 236, 238, 0.6);
    --glass-bg: rgba(20, 15, 18, 0.4);
    --glass-border: rgba(255, 255, 255, 0.12);
    --transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    height: 100%;
    -webkit-user-select: none;
    user-select: none; 
    -webkit-touch-callout: none; 
    touch-action: manipulation;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: stretch; 
    position: relative;
    overflow-x: hidden;
  }

  /* ========================================= */
  /* ЕКРАН ЗАВАНТАЖЕННЯ (ПРЕЛОАДЕР) */
  /* ========================================= */
  .preloader {
    position: fixed;
    inset: 0;
    z-index: 999999;
    background: rgba(10, 8, 9, 0.85); 
    backdrop-filter: blur(35px); 
    -webkit-backdrop-filter: blur(35px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: opacity 0.8s ease-in-out, visibility 0.8s ease-in-out;
  }

  .preloader.hidden {
    opacity: 0;
    visibility: hidden;
  }

  .preloader-name {
    font-family: 'Raleway', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--text-main);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    animation: preloader-pulse 2s infinite alternate ease-in-out;
  }

  .preloader-text {
    margin-top: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.3em;
    color: var(--text-muted);
    animation: preloader-pulse 2s infinite alternate ease-in-out;
    animation-delay: 0.5s; 
  }

  @keyframes preloader-pulse {
    0% { opacity: 0.3; filter: blur(2px); transform: scale(0.98); }
    100% { opacity: 1; filter: blur(0px); transform: scale(1); text-shadow: 0 0 20px rgba(255,255,255,0.4); }
  }

  /* ========================================= */
  /* ГЛОБАЛЬНИЙ ФОН (БЛЮР + ВІДЕО/ФОТО) */
  /* ========================================= */
  .global-blur-bg {
    position: fixed;
    top: -15%; left: -15%;
    width: 130%; height: 130%; 
    z-index: -3;
    pointer-events: none;
    overflow: hidden;
    background: #000;
  }

  .global-media {
    width: 100%; height: 100%;
    object-fit: cover;
    filter: blur(55px) brightness(0.35) saturate(1.3);
    transform: scale(1.1);
  }

  .global-tint {
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;
    background: radial-gradient(circle at center, rgba(10, 8, 9, 0.2) 0%, rgba(10, 8, 9, 0.7) 100%);
  }

  /* ========================================= */
  /* ГОЛОВНА КАРТКА */
  /* ========================================= */
  .page {
    position: relative;
    z-index: 1;
    flex: 1 0 auto;
    min-height: 100%;
    display: flex;
    justify-content: center;
    align-items: stretch;
    opacity: 0; 
    transform: translateY(20px);
    transition: opacity 0.8s ease-out, transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .page.loaded {
    opacity: 1;
    transform: translateY(0);
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 420px;
    min-width: 320px;
    min-height: 100%;
    background: #000000;
    isolation: isolate;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  @media (min-width: 768px) {
    .card {
      margin: 40px 0;
      border-radius: 32px;
      box-shadow: 0px 30px 80px -10px rgba(0,0,0,0.8);
      min-height: auto;
    }
  }

  .card-bg-layer {
    position: absolute;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
    background: var(--bg-dark);
  }
  
  .card-bg-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(10, 8, 9, 0.4) 0%, rgba(10, 8, 9, 0.8) 100%);
  }

  .media-fill {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  .card-content {
    position: relative;
    z-index: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 24px 30px 24px;
    height: 100%;
  }

  /* ========================================= */
  /* ІМ'Я ТА ПІДПИС */
  /* ========================================= */
  .header-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 100%;
    margin-bottom: 24px;
  }

  .title-row {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px; /* Відступ між іменем і галочкою */
    margin-bottom: 8px;
  }

  .title-text {
    font-family: 'Raleway', sans-serif;
    font-size: 34px;
    font-weight: 700;
    line-height: 1.1;
    text-align: center;
    color: var(--text-main);
    text-shadow: 0 4px 12px rgba(0,0,0,0.6);
    letter-spacing: -0.01em;
  }

  .verified-icon {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    fill: #1D9BF0; 
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
  }

  .subtitle-text {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0.02em;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }

  /* ========================================= */
  /* ІКОНКА ІНСТАГРАМ */
  /* ========================================= */
  .social-section {
    display: flex;
    justify-content: center;
    margin-bottom: 30px;
  }

  .social-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--glass-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: var(--transition);
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }
  
  .social-btn:active { transform: scale(0.92); }

  .social-btn svg {
    width: 20px;
    height: 20px;
    fill: var(--text-main);
  }

  /* ========================================= */
  /* ФОТО-КНОПКИ */
  /* ========================================= */
  .links-section {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .link-card {
    position: relative;
    width: 100%;
    height: 240px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    text-decoration: none;
    cursor: pointer;
    transform: translateZ(0);
    transition: var(--transition);
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
  }

  .link-card:active { transform: scale(0.97); }

  .link-media-wrapper {
    position: absolute;
    inset: 0;
    z-index: 0;
  }

  .link-media-wrapper img, .link-media-wrapper video {
    transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .link-card:hover .link-media-wrapper img,
  .link-card:hover .link-media-wrapper video {
    transform: scale(1.05);
  }

  .link-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.6) 100%);
    z-index: 1;
  }

  .link-icon {
    position: absolute;
    top: 14px;
    left: 14px;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }

  /* Цей фільтр робить іконки (OnlyFans і Telegram) чисто білими */
  .link-icon img {
    width: 20px;
    height: 20px;
    object-fit: contain;
    filter: brightness(0) invert(1); 
  }

  .link-text-wrapper {
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    transform: translateY(-50%);
    padding: 20px;
    display: flex;
    justify-content: center;
    z-index: 2;
  }

  .link-text {
    color: var(--text-main);
    font-size: 24px;
    font-weight: 600;
    text-align: center;
    text-shadow: 0 4px 12px rgba(0,0,0,0.8);
    letter-spacing: -0.01em;
  }

  /* ========================================= */
  /* ФУТЕР (ВОТЕРМАРКА) */
  /* ========================================= */
  .footer {
    margin-top: auto;
    padding-top: 30px;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.3);
    text-align: center;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  /* ========================================================= */
  /* ВІКНА (ВІК ТА АНТИ-БРАУЗЕР) */
  /* ========================================================= */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    /* Нейтральне, не рожеве затемнення */
    background: rgba(10, 10, 10, 0.65);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    z-index: 9999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    padding: 20px;
  }

  .modal-overlay.solid-bg { background: var(--bg-dark); z-index: 100000; }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }

  .modal-box {
    /* Білувате стильне матове скло */
    background: rgba(255, 255, 255, 0.08); 
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 24px;
    padding: 32px 24px;
    max-width: 320px;
    width: 100%;
    transform: translateY(15px) scale(0.95);
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
  }

  .modal-overlay.active .modal-box {
    transform: translateY(0) scale(1);
  }

  .modal-title {
    color: var(--text-main);
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 8px;
    letter-spacing: -0.01em;
  }

  .modal-subtitle {
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 30px;
  }

  .modal-buttons {
    display: flex;
    flex-direction: row;
    gap: 16px;
    width: 100%;
  }

  .modal-btn {
    flex: 1;
    padding: 16px 10px;
    border-radius: 999px;
    font-weight: 800;
    font-size: 16px;
    border: none;
    cursor: pointer;
    transition: var(--transition);
    font-family: 'Inter', sans-serif;
  }

  .btn-yes { background: #EBEBEB; color: #111; }
  .btn-no { background: rgba(255,255,255,0.05); color: var(--text-main); border: 1px solid rgba(255,255,255,0.1); }
  .btn-yes:active { transform: scale(0.95); filter: brightness(0.95); }
  .btn-no:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }

  .in-app-arrow {
    position: absolute;
    top: 40px; right: 24px;
    width: 44px; height: 44px;
    color: var(--text-main);
    animation: arrow-bounce 1s infinite alternate ease-in-out;
  }

  @keyframes arrow-bounce {
    0% { transform: translate(0, 0); }
    100% { transform: translate(12px, -12px); }
  }

  @media (max-width: 380px){
    body{ padding: 20px 14px; }
    .card{ padding: 34px 20px 28px; border-radius: 24px; }
    .link-card { height: 210px; }
  }
</style>
</head>

  document.getElementById('ui-of-text').innerText = CONFIG.btnOnlyFansText;
  document.getElementById('ui-tg-text').innerText = CONFIG.btnTelegramText;
  document.getElementById('ui-footer-name').innerText = "© " + CONFIG.nickname; 

  document.getElementById('ui-of-btn').href = CONFIG.onlyfansLink;
  document.getElementById('ui-tg-btn').href = CONFIG.telegramLink;
  document.getElementById('ui-ig-btn').href = CONFIG.instagramLink;

  // -----------------------------------------------------------
  // ЛОГІКА ПРЕЛОАДЕРА
  // -----------------------------------------------------------
  window.addEventListener('load', function() {
    setTimeout(function() {
      document.getElementById('preloader').classList.add('hidden');
      document.getElementById('main-page').classList.add('loaded');
    }, 1200); 
  });

  // -----------------------------------------------------------
  // ОБРОБКА ГІФКИ / ВІДЕО
  // -----------------------------------------------------------
  const bgMediaFile = CONFIG.mainBackgroundMedia;
  const isBgVideo = bgMediaFile.match(/\.(mp4|webm)$/i);
  
  const cardBgContainer = document.getElementById('card-bg-container');
  const globalBgContainer = document.getElementById('global-bg-container');

  function createMediaElement(src, isVid, extraClass = '') {
    if (isVid) {
      const vid = document.createElement('video');
      vid.src = src; vid.className = 'media-fill ' + extraClass; vid.autoplay = true; vid.loop = true; vid.muted = true; vid.playsInline = true;
      return vid;
    } else {
      const img = document.createElement('img');
      img.src = src; img.className = 'media-fill ' + extraClass; img.alt = "Background";
      return img;
    }
  }

  const cardMedia = createMediaElement(bgMediaFile, isBgVideo);
  cardBgContainer.insertBefore(cardMedia, cardBgContainer.firstChild);

  const globalMedia = createMediaElement(bgMediaFile, isBgVideo, 'global-media');
  globalBgContainer.appendChild(globalMedia);

  if (!isBgVideo) {
    const exts = ['.jpg', '.jpeg', '.png', '.gif'];
    let extIndex = 0;
    const baseName = bgMediaFile.substring(0, bgMediaFile.lastIndexOf('.')) || bgMediaFile;
    
    cardMedia.onerror = function() {
      if (extIndex < exts.length) {
        const newSrc = baseName + exts[extIndex];
        cardMedia.src = newSrc;
        globalMedia.src = newSrc;
        extIndex++;
      } else {
        cardMedia.onerror = null;
        cardMedia.style.display = 'none';
        globalMedia.style.display = 'none';
      }
    };
  }

  const btnMediaFile = CONFIG.btnOnlyFansBg;
  const isBtnVideo = btnMediaFile.match(/\.(mp4|webm)$/i);
  const ofBtnMediaContainer = document.getElementById('ui-of-btn-media');

  const btnMedia = createMediaElement(btnMediaFile, isBtnVideo);
  ofBtnMediaContainer.appendChild(btnMedia);

  if (!isBtnVideo) {
    const extsBtn = ['.jpg', '.jpeg', '.png', '.gif'];
    let extBtnIndex = 0;
    const baseBtnName = btnMediaFile.substring(0, btnMediaFile.lastIndexOf('.')) || btnMediaFile;
    
    btnMedia.onerror = function() {
      if (extBtnIndex < extsBtn.length) {
        btnMedia.src = baseBtnName + extsBtn[extBtnIndex];
        extBtnIndex++;
      } else {
        btnMedia.onerror = null;
        btnMedia.style.display = 'none'; 
      }
    };
  }

  const tgBgEl = document.getElementById('ui-tg-bg');
  tgBgEl.src = CONFIG.btnTelegramBg;
  tgBgEl.onerror = function() { this.style.display = 'none'; };

  // -----------------------------------------------------------
  // ПЕРЕВІРКА НА ВБУДОВАНИЙ БРАУЗЕР
  // -----------------------------------------------------------
  const ua = navigator.userAgent || navigator.vendor || window.opera;
  const isAndroid = /android/i.test(ua);
  const isInApp = (ua.indexOf('Instagram') > -1 || ua.indexOf('Barcelona') > -1 || ua.indexOf('Threads') > -1 || ua.indexOf('FBAN') > -1 || ua.indexOf('FBAV') > -1 || ua.indexOf('TikTok') > -1 || ua.indexOf('Telegram') > -1);
  
  if (isInApp) {
    if (isAndroid) {
      const intentUrl = `intent://${window.location.href.replace(/^https?:\/\//, '')}#Intent;scheme=https;package=com.android.chrome;end;`;
      window.location.href = intentUrl;
      setTimeout(() => { document.getElementById('in-app-overlay').classList.add('active'); }, 1000);
    } else {
      document.getElementById('in-app-overlay').classList.add('active');
    }
  }

  document.getElementById('copy-link-btn').addEventListener('click', function() {
    const btn = this;
    navigator.clipboard.writeText(window.location.href).then(() => {
      btn.innerText = '✅ Link Copied!';
      btn.style.background = '#24d366'; 
      btn.style.color = '#fff';
      setTimeout(() => { 
        btn.innerText = '🔗 Copy Website Link'; 
        btn.style.background = '#EBEBEB';
        btn.style.color = '#111';
      }, 2500);
    });
  });

  // -----------------------------------------------------------
  // ЛОГІКА ВІКОВОЇ ПЕРЕВІРКИ
  // -----------------------------------------------------------
  const ofBtn = document.getElementById('ui-of-btn');
  const ageModal = document.getElementById('age-modal');
  const btnYes = document.getElementById('btn-yes');
  const btnNo = document.getElementById('btn-no');

  ofBtn.addEventListener('click', function(e) { e.preventDefault(); ageModal.classList.add('active'); });
  btnYes.addEventListener('click', function() { ageModal.classList.remove('active'); window.location.href = CONFIG.onlyfansLink; });
  btnNo.addEventListener('click', function() { ageModal.classList.remove('active'); });

  // Захист контенту
  document.addEventListener('contextmenu', e => e.preventDefault()); 
  document.addEventListener('dragstart', e => e.preventDefault());   
  document.onkeydown = function(e) {
    if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 67 || e.keyCode == 74)) || (e.ctrlKey && (e.keyCode == 85 || e.keyCode == 83 || e.keyCode == 67))) return false; 
  };
</script>
</body>
</html>
